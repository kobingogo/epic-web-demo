<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>FLUID · 流体之境</title>
<style>
  :root { --glass: rgba(255,255,255,.06); --line: rgba(255,255,255,.14); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: crosshair; }

  .title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; mix-blend-mode: difference; transition: opacity 1.6s ease, transform 1.6s ease; }
  .title h1 { font-size: clamp(64px, 16vw, 240px); font-weight: 900; letter-spacing: .08em; line-height: .9;
    color: #fff; text-transform: uppercase; }
  .title p { margin-top: 18px; font-size: clamp(12px, 1.4vw, 16px); letter-spacing: .6em; opacity: .85; }
  .title.hide { opacity: 0; transform: scale(1.15); filter: blur(8px); }

  .brand { position: fixed; top: 22px; left: 26px; font-size: 12px; letter-spacing: .35em; opacity: .7;
    mix-blend-mode: difference; pointer-events: none; }
  .brand b { font-weight: 800; }
  .stats { position: fixed; top: 22px; right: 26px; font: 11px/1.6 ui-monospace, Menlo, monospace; opacity: .55;
    text-align: right; mix-blend-mode: difference; pointer-events: none; }

  .dock { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 8px; padding: 8px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
    backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
    box-shadow: 0 10px 40px rgba(0,0,0,.45); user-select: none; z-index: 5; }
  .dock button { all: unset; cursor: pointer; padding: 10px 14px; border-radius: 12px; font-size: 13px;
    display: flex; align-items: center; gap: 8px; color: #fff; transition: background .2s, transform .15s; white-space: nowrap; }
  .dock button:hover { background: rgba(255,255,255,.12); }
  .dock button:active { transform: scale(.94); }
  .dock button.on { background: rgba(255,255,255,.2); }
  .dock kbd { font: 10px ui-monospace, monospace; opacity: .5; border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
  .dock .sw { width: 12px; height: 12px; border-radius: 50%; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  @media (max-width: 720px) { .dock kbd, .dock .lbl { display: none; } .dock button { padding: 10px; } }

  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(10px); opacity: 0;
    font-size: 12px; letter-spacing: .3em; padding: 8px 16px; border-radius: 99px; background: var(--glass);
    border: 1px solid var(--line); backdrop-filter: blur(12px); transition: all .35s ease; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="brand"><b>FLUID</b> / NAVIER–STOKES ON GPU</div>
<div class="stats" id="stats"></div>

<div class="title" id="title">
  <h1>Fluid</h1>
  <p>移动 · 拖拽 · 双击引爆</p>
</div>

<div class="dock">
  <button id="bPalette" title="切换调色板"><span class="sw"></span><span class="lbl" id="palName">彩虹</span><kbd>C</kbd></button>
  <button id="bBoom" title="中心爆裂">💥<span class="lbl">爆裂</span><kbd>Space</kbd></button>
  <button id="bAuto" class="on" title="自动漂流">🌀<span class="lbl">漂流</span><kbd>A</kbd></button>
  <button id="bBloom" class="on" title="辉光">✨<span class="lbl">辉光</span><kbd>B</kbd></button>
  <button id="bMic" title="音乐律动（麦克风）">🎤<span class="lbl">律动</span><kbd>M</kbd></button>
  <button id="bPause" title="暂停">⏸<span class="lbl">冻结</span><kbd>P</kbd></button>
  <button id="bShot" title="截图">📸<span class="lbl">截图</span><kbd>S</kbd></button>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   FLUID — 基于 WebGL 的实时流体模拟（Navier–Stokes）
   管线：涡度 → 散度 → 压力（Jacobi 迭代）→ 梯度相减 → 平流
   ========================================================= */

const isMobile = /Mobi|Android/i.test(navigator.userAgent);
const config = {
  SIM_RESOLUTION: 128,
  DYE_RESOLUTION: isMobile ? 512 : 1440,
  DENSITY_DISSIPATION: 0.97,
  VELOCITY_DISSIPATION: 0.25,
  PRESSURE: 0.8,
  PRESSURE_ITERATIONS: 20,
  CURL: 32,
  SPLAT_RADIUS: 0.22,
  SPLAT_FORCE: 6500,
  SHADING: true,
  PAUSED: false,
  AUTO: true,
  BLOOM: true,
  BLOOM_ITERATIONS: 8,
  BLOOM_RESOLUTION: 256,
  BLOOM_INTENSITY: 0.9,
  BLOOM_THRESHOLD: 0.55,
  BLOOM_SOFT_KNEE: 0.7,
};

const PALETTES = [
  { name: '彩虹', hue: () => Math.random() },
  { name: '霓虹', hue: () => (Math.random() < .5 ? .5 + Math.random() * .06 : .83 + Math.random() * .08) },
  { name: '烈焰', hue: () => Math.random() * .12 },
  { name: '深海', hue: () => .48 + Math.random() * .2 },
  { name: '极光', hue: () => (Math.random() < .6 ? .3 + Math.random() * .15 : .72 + Math.random() * .1) },
];
let paletteIndex = 0;

/* ---------------- WebGL 上下文 ---------------- */
const canvas = document.getElementById('c');
resizeCanvas();
const { gl, ext } = getWebGLContext(canvas);
if (!ext.supportLinearFiltering) { config.DYE_RESOLUTION = 512; config.SHADING = false; }

function getWebGLContext(canvas) {
  const params = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
  let gl = canvas.getContext('webgl2', params);
  const isWebGL2 = !!gl;
  if (!isWebGL2) gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
  if (!gl) { document.body.innerHTML = '<p style="padding:40px">你的浏览器不支持 WebGL 😢</p>'; throw new Error('no webgl'); }

  let halfFloat, supportLinearFiltering;
  if (isWebGL2) {
    gl.getExtension('EXT_color_buffer_float');
    supportLinearFiltering = gl.getExtension('OES_texture_float_linear');
  } else {
    halfFloat = gl.getExtension('OES_texture_half_float');
    supportLinearFiltering = gl.getExtension('OES_texture_half_float_linear');
  }
  gl.clearColor(0, 0, 0, 1);
  const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : halfFloat.HALF_FLOAT_OES;
  let formatRGBA, formatRG, formatR;
  if (isWebGL2) {
    formatRGBA = getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, halfFloatTexType);
    formatRG = getSupportedFormat(gl, gl.RG16F, gl.RG, halfFloatTexType);
    formatR = getSupportedFormat(gl, gl.R16F, gl.RED, halfFloatTexType);
  } else {
    formatRGBA = formatRG = formatR = getSupportedFormat(gl, gl.RGBA, gl.RGBA, halfFloatTexType);
  }
  return { gl, ext: { formatRGBA, formatRG, formatR, halfFloatTexType, supportLinearFiltering } };
}

function getSupportedFormat(gl, internalFormat, format, type) {
  if (!supportRenderTextureFormat(gl, internalFormat, format, type)) {
    switch (internalFormat) {
      case gl.R16F: return getSupportedFormat(gl, gl.RG16F, gl.RG, type);
      case gl.RG16F: return getSupportedFormat(gl, gl.RGBA16F, gl.RGBA, type);
      default: return null;
    }
  }
  return { internalFormat, format };
}

function supportRenderTextureFormat(gl, internalFormat, format, type) {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, 4, 4, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  return gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
}

/* ---------------- 着色器 ---------------- */
class Program {
  constructor(vs, fs) {
    this.program = gl.createProgram();
    gl.attachShader(this.program, vs);
    gl.attachShader(this.program, fs);
    gl.bindAttribLocation(this.program, 0, 'aPosition');
    gl.linkProgram(this.program);
    if (!gl.getProgramParameter(this.program, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(this.program));
    this.uniforms = {};
    const n = gl.getProgramParameter(this.program, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const name = gl.getActiveUniform(this.program, i).name;
      this.uniforms[name] = gl.getUniformLocation(this.program, name);
    }
  }
  bind() { gl.useProgram(this.program); }
}

function compileShader(type, source, keywords) {
  if (keywords) source = keywords.map(k => '#define ' + k + '\n').join('') + source;
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(shader));
  return shader;
}

const HEAD = `precision highp float; precision highp sampler2D;
varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;\n`;

const baseVertexShader = compileShader(gl.VERTEX_SHADER, `
precision highp float;
attribute vec2 aPosition;
varying vec2 vUv; varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
uniform vec2 texelSize;
void main () {
  vUv = aPosition * 0.5 + 0.5;
  vL = vUv - vec2(texelSize.x, 0.0);
  vR = vUv + vec2(texelSize.x, 0.0);
  vT = vUv + vec2(0.0, texelSize.y);
  vB = vUv - vec2(0.0, texelSize.y);
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`);

const fs = (src, kw) => compileShader(gl.FRAGMENT_SHADER, HEAD + src, kw);

const copyShader = fs(`uniform sampler2D uTexture;
void main(){ gl_FragColor = texture2D(uTexture, vUv); }`);

const clearShader = fs(`uniform sampler2D uTexture; uniform float value;
void main(){ gl_FragColor = value * texture2D(uTexture, vUv); }`);

const splatShader = fs(`uniform sampler2D uTarget; uniform float aspectRatio; uniform vec3 color; uniform vec2 point; uniform float radius;
void main(){
  vec2 p = vUv - point.xy; p.x *= aspectRatio;
  vec3 splat = exp(-dot(p, p) / radius) * color;
  vec3 base = texture2D(uTarget, vUv).xyz;
  gl_FragColor = vec4(base + splat, 1.0);
}`);

const advectionSrc = `uniform sampler2D uVelocity; uniform sampler2D uSource;
uniform vec2 texelSize; uniform vec2 dyeTexelSize; uniform float dt; uniform float dissipation;
vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
  vec2 st = uv / tsize - 0.5; vec2 iuv = floor(st); vec2 fuv = fract(st);
  vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
  vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
  vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
  vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
  return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
}
void main(){
#ifdef MANUAL_FILTERING
  vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
  vec4 result = bilerp(uSource, coord, dyeTexelSize);
#else
  vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
  vec4 result = texture2D(uSource, coord);
#endif
  float decay = 1.0 + dissipation * dt;
  gl_FragColor = result / decay;
}`;
const advectionShader = fs(advectionSrc, ext.supportLinearFiltering ? null : ['MANUAL_FILTERING']);

const divergenceShader = fs(`uniform sampler2D uVelocity;
void main(){
  float L = texture2D(uVelocity, vL).x; float R = texture2D(uVelocity, vR).x;
  float T = texture2D(uVelocity, vT).y; float B = texture2D(uVelocity, vB).y;
  vec2 C = texture2D(uVelocity, vUv).xy;
  if (vL.x < 0.0) { L = -C.x; } if (vR.x > 1.0) { R = -C.x; }
  if (vT.y > 1.0) { T = -C.y; } if (vB.y < 0.0) { B = -C.y; }
  gl_FragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
}`);

const curlShader = fs(`uniform sampler2D uVelocity;
void main(){
  float L = texture2D(uVelocity, vL).y; float R = texture2D(uVelocity, vR).y;
  float T = texture2D(uVelocity, vT).x; float B = texture2D(uVelocity, vB).x;
  gl_FragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
}`);

const vorticityShader = fs(`uniform sampler2D uVelocity; uniform sampler2D uCurl; uniform float curl; uniform float dt;
void main(){
  float L = texture2D(uCurl, vL).x; float R = texture2D(uCurl, vR).x;
  float T = texture2D(uCurl, vT).x; float B = texture2D(uCurl, vB).x;
  float C = texture2D(uCurl, vUv).x;
  vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
  force /= length(force) + 0.0001; force *= curl * C; force.y *= -1.0;
  vec2 vel = texture2D(uVelocity, vUv).xy + force * dt;
  vel = min(max(vel, -1000.0), 1000.0);
  gl_FragColor = vec4(vel, 0.0, 1.0);
}`);

const pressureShader = fs(`uniform sampler2D uPressure; uniform sampler2D uDivergence;
void main(){
  float L = texture2D(uPressure, vL).x; float R = texture2D(uPressure, vR).x;
  float T = texture2D(uPressure, vT).x; float B = texture2D(uPressure, vB).x;
  float div = texture2D(uDivergence, vUv).x;
  gl_FragColor = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 1.0);
}`);

const gradientSubtractShader = fs(`uniform sampler2D uPressure; uniform sampler2D uVelocity;
void main(){
  float L = texture2D(uPressure, vL).x; float R = texture2D(uPressure, vR).x;
  float T = texture2D(uPressure, vT).x; float B = texture2D(uPressure, vB).x;
  vec2 v = texture2D(uVelocity, vUv).xy;
  v -= vec2(R - L, T - B);
  gl_FragColor = vec4(v, 0.0, 1.0);
}`);

const bloomPrefilterShader = fs(`uniform sampler2D uTexture; uniform vec3 curve; uniform float threshold;
void main(){
  vec3 c = texture2D(uTexture, vUv).rgb;
  float br = max(c.r, max(c.g, c.b));
  float rq = clamp(br - curve.x, 0.0, curve.y); rq = curve.z * rq * rq;
  c *= max(rq, br - threshold) / max(br, 0.0001);
  gl_FragColor = vec4(c, 0.0);
}`);

const bloomBlurShader = fs(`uniform sampler2D uTexture;
void main(){
  vec4 s = texture2D(uTexture, vL) + texture2D(uTexture, vR) + texture2D(uTexture, vT) + texture2D(uTexture, vB);
  gl_FragColor = s * 0.25;
}`);

const bloomFinalShader = fs(`uniform sampler2D uTexture; uniform float intensity;
void main(){
  vec4 s = texture2D(uTexture, vL) + texture2D(uTexture, vR) + texture2D(uTexture, vT) + texture2D(uTexture, vB);
  gl_FragColor = s * 0.25 * intensity;
}`);

const displayShader = fs(`uniform sampler2D uTexture; uniform sampler2D uBloom;
uniform vec2 texelSize; uniform float uShading; uniform float uBloomOn; uniform float uTime;
vec3 linearToGamma (vec3 c) { c = max(c, vec3(0)); return max(1.055 * pow(c, vec3(0.416666667)) - 0.055, vec3(0)); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uTime) * 43758.5453); }
void main(){
  vec3 c = texture2D(uTexture, vUv).rgb;
  if (uShading > 0.5) {
    vec3 lc = texture2D(uTexture, vL).rgb; vec3 rc = texture2D(uTexture, vR).rgb;
    vec3 tc = texture2D(uTexture, vT).rgb; vec3 bc = texture2D(uTexture, vB).rgb;
    float dx = length(rc) - length(lc); float dy = length(tc) - length(bc);
    vec3 n = normalize(vec3(dx, dy, length(texelSize)));
    float diffuse = clamp(dot(n, vec3(0.0, 0.0, 1.0)) + 0.7, 0.7, 1.0);
    // 镜面高光，让流体有"液态金属"般的质感
    vec3 h = normalize(vec3(0.3, 0.5, 1.0));
    float spec = pow(max(dot(n, h), 0.0), 60.0) * min(length(c), 1.0) * 0.35;
    c = c * diffuse + spec;
  }
  if (uBloomOn > 0.5) c += linearToGamma(texture2D(uBloom, vUv).rgb);
  vec2 p = vUv - 0.5;
  c *= 1.0 - dot(p, p) * 0.7;                // 暗角
  c += (hash(vUv * 1000.0) - 0.5) * 0.025;   // 胶片颗粒
  gl_FragColor = vec4(c, 1.0);
}`);

/* ---------------- 几何 & 绘制 ---------------- */
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.enableVertexAttribArray(0);

function blit(target, clear = false) {
  if (target == null) {
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  } else {
    gl.viewport(0, 0, target.width, target.height);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
  }
  if (clear) gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
}

const P = (f) => new Program(baseVertexShader, f);
const copyProgram = P(copyShader), clearProgram = P(clearShader), splatProgram = P(splatShader),
  advectionProgram = P(advectionShader), divergenceProgram = P(divergenceShader), curlProgram = P(curlShader),
  vorticityProgram = P(vorticityShader), pressureProgram = P(pressureShader), gradienSubtractProgram = P(gradientSubtractShader),
  bloomPrefilterProgram = P(bloomPrefilterShader), bloomBlurProgram = P(bloomBlurShader), bloomFinalProgram = P(bloomFinalShader),
  displayProgram = P(displayShader);

/* ---------------- 帧缓冲 ---------------- */
let dye, velocity, divergence, curl, pressure, bloom, bloomFramebuffers = [];

function createFBO(w, h, internalFormat, format, type, param) {
  gl.activeTexture(gl.TEXTURE0);
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, param);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, param);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, internalFormat, w, h, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  gl.viewport(0, 0, w, h);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return {
    texture, fbo, width: w, height: h, texelSizeX: 1 / w, texelSizeY: 1 / h,
    attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, texture); return id; },
  };
}

function createDoubleFBO(w, h, internalFormat, format, type, param) {
  let f1 = createFBO(w, h, internalFormat, format, type, param);
  let f2 = createFBO(w, h, internalFormat, format, type, param);
  return {
    width: w, height: h, texelSizeX: f1.texelSizeX, texelSizeY: f1.texelSizeY,
    get read() { return f1; }, set read(v) { f1 = v; },
    get write() { return f2; }, set write(v) { f2 = v; },
    swap() { const t = f1; f1 = f2; f2 = t; },
  };
}

function resizeFBO(target, w, h, internalFormat, format, type, param) {
  const n = createFBO(w, h, internalFormat, format, type, param);
  copyProgram.bind();
  gl.uniform1i(copyProgram.uniforms.uTexture, target.attach(0));
  blit(n);
  return n;
}

function resizeDoubleFBO(target, w, h, internalFormat, format, type, param) {
  if (target.width === w && target.height === h) return target;
  target.read = resizeFBO(target.read, w, h, internalFormat, format, type, param);
  target.write = createFBO(w, h, internalFormat, format, type, param);
  target.width = w; target.height = h; target.texelSizeX = 1 / w; target.texelSizeY = 1 / h;
  return target;
}

function initFramebuffers() {
  const simRes = getResolution(config.SIM_RESOLUTION);
  const dyeRes = getResolution(config.DYE_RESOLUTION);
  const texType = ext.halfFloatTexType, rgba = ext.formatRGBA, rg = ext.formatRG, r = ext.formatR;
  const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
  gl.disable(gl.BLEND);

  dye = dye ? resizeDoubleFBO(dye, dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering)
            : createDoubleFBO(dyeRes.width, dyeRes.height, rgba.internalFormat, rgba.format, texType, filtering);
  velocity = velocity ? resizeDoubleFBO(velocity, simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering)
                      : createDoubleFBO(simRes.width, simRes.height, rg.internalFormat, rg.format, texType, filtering);
  divergence = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
  curl = createFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);
  pressure = createDoubleFBO(simRes.width, simRes.height, r.internalFormat, r.format, texType, gl.NEAREST);

  const res = getResolution(config.BLOOM_RESOLUTION);
  bloom = createFBO(res.width, res.height, rgba.internalFormat, rgba.format, texType, filtering);
  bloomFramebuffers = [];
  for (let i = 0; i < config.BLOOM_ITERATIONS; i++) {
    const w = res.width >> (i + 1), h = res.height >> (i + 1);
    if (w < 2 || h < 2) break;
    bloomFramebuffers.push(createFBO(w, h, rgba.internalFormat, rgba.format, texType, filtering));
  }
}

function getResolution(resolution) {
  let aspect = gl.drawingBufferWidth / gl.drawingBufferHeight;
  if (aspect < 1) aspect = 1 / aspect;
  const min = Math.round(resolution), max = Math.round(resolution * aspect);
  return gl.drawingBufferWidth > gl.drawingBufferHeight ? { width: max, height: min } : { width: min, height: max };
}

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(canvas.clientWidth * dpr), h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; return true; }
  return false;
}

/* ---------------- 模拟一步 ---------------- */
function step(dt) {
  gl.disable(gl.BLEND);
  const u = (p) => p.uniforms;

  curlProgram.bind();
  gl.uniform2f(u(curlProgram).texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(u(curlProgram).uVelocity, velocity.read.attach(0));
  blit(curl);

  vorticityProgram.bind();
  gl.uniform2f(u(vorticityProgram).texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(u(vorticityProgram).uVelocity, velocity.read.attach(0));
  gl.uniform1i(u(vorticityProgram).uCurl, curl.attach(1));
  gl.uniform1f(u(vorticityProgram).curl, config.CURL);
  gl.uniform1f(u(vorticityProgram).dt, dt);
  blit(velocity.write); velocity.swap();

  divergenceProgram.bind();
  gl.uniform2f(u(divergenceProgram).texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(u(divergenceProgram).uVelocity, velocity.read.attach(0));
  blit(divergence);

  clearProgram.bind();
  gl.uniform1i(u(clearProgram).uTexture, pressure.read.attach(0));
  gl.uniform1f(u(clearProgram).value, config.PRESSURE);
  blit(pressure.write); pressure.swap();

  pressureProgram.bind();
  gl.uniform2f(u(pressureProgram).texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(u(pressureProgram).uDivergence, divergence.attach(0));
  for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
    gl.uniform1i(u(pressureProgram).uPressure, pressure.read.attach(1));
    blit(pressure.write); pressure.swap();
  }

  gradienSubtractProgram.bind();
  gl.uniform2f(u(gradienSubtractProgram).texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(u(gradienSubtractProgram).uPressure, pressure.read.attach(0));
  gl.uniform1i(u(gradienSubtractProgram).uVelocity, velocity.read.attach(1));
  blit(velocity.write); velocity.swap();

  advectionProgram.bind();
  gl.uniform2f(u(advectionProgram).texelSize, velocity.texelSizeX, velocity.texelSizeY);
  if (!ext.supportLinearFiltering) gl.uniform2f(u(advectionProgram).dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
  const vId = velocity.read.attach(0);
  gl.uniform1i(u(advectionProgram).uVelocity, vId);
  gl.uniform1i(u(advectionProgram).uSource, vId);
  gl.uniform1f(u(advectionProgram).dt, dt);
  gl.uniform1f(u(advectionProgram).dissipation, config.VELOCITY_DISSIPATION);
  blit(velocity.write); velocity.swap();

  if (!ext.supportLinearFiltering) gl.uniform2f(u(advectionProgram).dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(u(advectionProgram).uVelocity, velocity.read.attach(0));
  gl.uniform1i(u(advectionProgram).uSource, dye.read.attach(1));
  gl.uniform1f(u(advectionProgram).dissipation, config.DENSITY_DISSIPATION);
  blit(dye.write); dye.swap();
}

/* ---------------- 渲染 ---------------- */
let time = 0;
function render() {
  if (config.BLOOM) applyBloom(dye.read, bloom);
  gl.disable(gl.BLEND);
  displayProgram.bind();
  const u = displayProgram.uniforms;
  gl.uniform2f(u.texelSize, 1 / gl.drawingBufferWidth, 1 / gl.drawingBufferHeight);
  gl.uniform1i(u.uTexture, dye.read.attach(0));
  gl.uniform1i(u.uBloom, bloom.attach(1));
  gl.uniform1f(u.uShading, config.SHADING ? 1 : 0);
  gl.uniform1f(u.uBloomOn, config.BLOOM ? 1 : 0);
  gl.uniform1f(u.uTime, time % 100);
  blit(null);
}

function applyBloom(source, destination) {
  if (bloomFramebuffers.length < 2) return;
  let last = destination;
  gl.disable(gl.BLEND);
  bloomPrefilterProgram.bind();
  const knee = config.BLOOM_THRESHOLD * config.BLOOM_SOFT_KNEE + 0.0001;
  gl.uniform3f(bloomPrefilterProgram.uniforms.curve, config.BLOOM_THRESHOLD - knee, knee * 2, 0.25 / knee);
  gl.uniform1f(bloomPrefilterProgram.uniforms.threshold, config.BLOOM_THRESHOLD);
  gl.uniform1i(bloomPrefilterProgram.uniforms.uTexture, source.attach(0));
  blit(last);

  bloomBlurProgram.bind();
  for (const dest of bloomFramebuffers) {
    gl.uniform2f(bloomBlurProgram.uniforms.texelSize, last.texelSizeX, last.texelSizeY);
    gl.uniform1i(bloomBlurProgram.uniforms.uTexture, last.attach(0));
    blit(dest); last = dest;
  }
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.enable(gl.BLEND);
  for (let i = bloomFramebuffers.length - 2; i >= 0; i--) {
    const base = bloomFramebuffers[i];
    gl.uniform2f(bloomBlurProgram.uniforms.texelSize, last.texelSizeX, last.texelSizeY);
    gl.uniform1i(bloomBlurProgram.uniforms.uTexture, last.attach(0));
    blit(base); last = base;
  }
  gl.disable(gl.BLEND);
  bloomFinalProgram.bind();
  gl.uniform2f(bloomFinalProgram.uniforms.texelSize, last.texelSizeX, last.texelSizeY);
  gl.uniform1i(bloomFinalProgram.uniforms.uTexture, last.attach(0));
  gl.uniform1f(bloomFinalProgram.uniforms.intensity, config.BLOOM_INTENSITY);
  blit(destination);
}

/* ---------------- 注入：颜料 + 力 ---------------- */
function splat(x, y, dx, dy, color, radiusScale = 1) {
  splatProgram.bind();
  const u = splatProgram.uniforms;
  gl.uniform1i(u.uTarget, velocity.read.attach(0));
  gl.uniform1f(u.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(u.point, x, y);
  gl.uniform3f(u.color, dx, dy, 0);
  gl.uniform1f(u.radius, correctRadius(config.SPLAT_RADIUS * radiusScale / 100));
  blit(velocity.write); velocity.swap();
  gl.uniform1i(u.uTarget, dye.read.attach(0));
  gl.uniform3f(u.color, color.r, color.g, color.b);
  blit(dye.write); dye.swap();
}

function correctRadius(r) { const a = canvas.width / canvas.height; return a > 1 ? r * a : r; }

function HSVtoRGB(h, s, v) {
  const i = Math.floor(h * 6), f = h * 6 - i, p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  switch (((i % 6) + 6) % 6) {
    case 0: return { r: v, g: t, b: p }; case 1: return { r: q, g: v, b: p };
    case 2: return { r: p, g: v, b: t }; case 3: return { r: p, g: q, b: v };
    case 4: return { r: t, g: p, b: v }; default: return { r: v, g: p, b: q };
  }
}
function generateColor(mult = 0.15) {
  const c = HSVtoRGB(PALETTES[paletteIndex].hue(), 1, 1);
  return { r: c.r * mult, g: c.g * mult, b: c.b * mult };
}

// 径向爆裂：一圈喷流向外炸开
function explode(x, y, power = 1) {
  const n = 14;
  const base = Math.random() * Math.PI * 2;
  for (let i = 0; i < n; i++) {
    const a = base + (i / n) * Math.PI * 2;
    const f = 1400 * power * (0.7 + Math.random() * 0.6);
    const c = generateColor(0.6);
    splat(x + Math.cos(a) * 0.01, y + Math.sin(a) * 0.01, Math.cos(a) * f, Math.sin(a) * f, c, 0.6);
  }
  const core = generateColor(0.7);
  splat(x, y, 0, 0, core, 1.2);
}

function randomSplats(amount) {
  for (let i = 0; i < amount; i++) {
    const c = generateColor(1.2);
    splat(Math.random(), Math.random(), 1000 * (Math.random() - 0.5), 1000 * (Math.random() - 0.5), c);
  }
}

/* ---------------- 指针输入 ---------------- */
const pointers = new Map();
let lastInteraction = -10, introHidden = false;
const dpr = () => canvas.width / canvas.clientWidth;

function getPointer(id) {
  if (!pointers.has(id)) pointers.set(id, { x: 0, y: 0, px: 0, py: 0, dx: 0, dy: 0, moved: false, down: false, init: false, color: generateColor() });
  return pointers.get(id);
}
function updatePointer(p, e) {
  const x = (e.clientX * dpr()) / canvas.width, y = 1 - (e.clientY * dpr()) / canvas.height;
  if (!p.init) { p.x = p.px = x; p.y = p.py = y; p.init = true; return; }
  p.px = p.x; p.py = p.y; p.x = x; p.y = y;
  const aspect = canvas.width / canvas.height;
  p.dx = (p.x - p.px) * (aspect < 1 ? aspect : 1);
  p.dy = (p.y - p.py) / (aspect > 1 ? aspect : 1);
  p.moved = Math.abs(p.dx) > 0 || Math.abs(p.dy) > 0;
}
function touchInteraction() {
  lastInteraction = time;
  if (!introHidden) { introHidden = true; document.getElementById('title').classList.add('hide'); }
}

canvas.addEventListener('pointermove', (e) => { updatePointer(getPointer(e.pointerId), e); touchInteraction(); });
canvas.addEventListener('pointerdown', (e) => {
  const p = getPointer(e.pointerId); p.down = true; p.init = false; updatePointer(p, e);
  p.color = generateColor(0.35);
  splat(p.x, p.y, 0, 0, generateColor(1.4), 1.3);
  touchInteraction();
});
const up = (e) => { const p = pointers.get(e.pointerId); if (p) { p.down = false; if (e.pointerType !== 'mouse') pointers.delete(e.pointerId); } };
canvas.addEventListener('pointerup', up);
canvas.addEventListener('pointercancel', up);
canvas.addEventListener('dblclick', (e) => {
  explode((e.clientX * dpr()) / canvas.width, 1 - (e.clientY * dpr()) / canvas.height, 1.3);
  flash('💥 BOOM');
});

function applyInputs() {
  for (const p of pointers.values()) {
    if (!p.moved) continue;
    p.moved = false;
    const force = config.SPLAT_FORCE * (p.down ? 1.6 : 0.9);
    const c = p.down ? p.color : { r: p.color.r * 0.55, g: p.color.g * 0.55, b: p.color.b * 0.55 };
    splat(p.x, p.y, p.dx * force, p.dy * force, c, p.down ? 1.2 : 0.8);
  }
}

/* ---------------- 自动漂流：两股利萨如轨迹喷流 ---------------- */
const emitters = [0, 1, 2].map((i) => ({ phase: i * 2.1, color: generateColor(0.5), px: 0.5, py: 0.5 }));
function autopilot(dt, boost = 0) {
  if (!config.AUTO) return;
  const idle = time - lastInteraction > 2.5;
  if (!idle && boost === 0) return;
  for (const e of emitters) {
    const t = time * 0.35 + e.phase;
    const x = 0.5 + 0.34 * Math.sin(t * 1.3) * Math.cos(t * 0.37);
    const y = 0.5 + 0.30 * Math.sin(t * 0.9 + 1.7);
    const dx = (x - e.px), dy = (y - e.py);
    e.px = x; e.py = y;
    const f = 9000 * (1 + boost * 3);
    const k = 0.25 + boost * 0.6;
    splat(x, y, dx * f, dy * f, { r: e.color.r * k, g: e.color.g * k, b: e.color.b * k }, 0.7 + boost);
  }
}

/* ---------------- 音乐律动（麦克风） ---------------- */
let analyser = null, freq = null, bassAvg = 0, beatCooldown = 0, level = 0;
async function toggleMic(btn) {
  if (analyser) { analyser = null; btn.classList.remove('on'); flash('律动 关'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser(); analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.6;
    src.connect(analyser);
    freq = new Uint8Array(analyser.frequencyBinCount);
    btn.classList.add('on'); flash('🎵 放首歌试试');
  } catch (err) { flash('无法访问麦克风'); }
}
function audioReact(dt) {
  if (!analyser) { level = 0; return 0; }
  analyser.getByteFrequencyData(freq);
  let bass = 0; for (let i = 1; i < 12; i++) bass += freq[i]; bass /= 11 * 255;
  let all = 0; for (let i = 0; i < freq.length; i++) all += freq[i]; level = all / (freq.length * 255);
  bassAvg = bassAvg * 0.92 + bass * 0.08;
  beatCooldown -= dt;
  if (bass > 0.35 && bass > bassAvg * 1.25 && beatCooldown <= 0) {
    beatCooldown = 0.22;
    explode(0.2 + Math.random() * 0.6, 0.2 + Math.random() * 0.6, 0.6 + bass);
  }
  return level;
}

/* ---------------- UI ---------------- */
const $ = (id) => document.getElementById(id);
let toastTimer;
function flash(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1200);
}
function cyclePalette() {
  paletteIndex = (paletteIndex + 1) % PALETTES.length;
  $('palName').textContent = PALETTES[paletteIndex].name;
  emitters.forEach((e) => (e.color = generateColor(0.5)));
  for (const p of pointers.values()) p.color = generateColor(0.35);
  flash('🎨 ' + PALETTES[paletteIndex].name);
  randomSplats(4);
}
const boom = () => { explode(0.5, 0.5, 1.6); flash('💥 BIG BANG'); touchInteraction(); };
const toggle = (key, btn, label) => { config[key] = !config[key]; btn.classList.toggle('on', key === 'PAUSED' ? config[key] : config[key]); flash(label + (config[key] ? ' 开' : ' 关')); };
let wantShot = false;

$('bPalette').onclick = cyclePalette;
$('bBoom').onclick = boom;
$('bAuto').onclick = function () { toggle('AUTO', this, '🌀 漂流'); };
$('bBloom').onclick = function () { toggle('BLOOM', this, '✨ 辉光'); };
$('bPause').onclick = function () { toggle('PAUSED', this, '⏸ 冻结'); };
$('bMic').onclick = function () { toggleMic(this); };
$('bShot').onclick = () => { wantShot = true; };

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); boom(); }
  else if (k === 'c') cyclePalette();
  else if (k === 'a') $('bAuto').click();
  else if (k === 'b') $('bBloom').click();
  else if (k === 'p') $('bPause').click();
  else if (k === 'm') $('bMic').click();
  else if (k === 's') wantShot = true;
});

/* ---------------- 主循环 ---------------- */
initFramebuffers();
randomSplats(Math.floor(Math.random() * 6) + 8);

let lastTime = performance.now(), colorTimer = 0, fps = 60, frames = 0, fpsTimer = 0;
const statsEl = $('stats');
function update() {
  const now = performance.now();
  const rawDt = (now - lastTime) / 1000;
  const dt = Math.min(rawDt, 0.016666);
  lastTime = now; time += dt;

  if (resizeCanvas()) initFramebuffers();

  colorTimer += dt * 1.2;
  if (colorTimer >= 1) {
    colorTimer = 0;
    for (const p of pointers.values()) p.color = generateColor(0.35);
    emitters.forEach((e) => (e.color = generateColor(0.5)));
  }

  applyInputs();
  const lvl = audioReact(dt);
  autopilot(dt, lvl);
  if (!config.PAUSED) step(dt);
  render();

  if (wantShot) {
    wantShot = false;
    const a = document.createElement('a');
    a.download = 'fluid-' + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click(); flash('📸 已保存');
  }

  frames++; fpsTimer += rawDt;
  if (fpsTimer > 0.5) {
    fps = Math.round(frames / fpsTimer); frames = 0; fpsTimer = 0;
    const s = getResolution(config.SIM_RESOLUTION), d = getResolution(config.DYE_RESOLUTION);
    statsEl.innerHTML = `${fps} FPS<br>SIM ${s.width}×${s.height}<br>DYE ${d.width}×${d.height}<br>JACOBI ×${config.PRESSURE_ITERATIONS}`;
  }
  requestAnimationFrame(update);
}
update();
</script>
</body>
